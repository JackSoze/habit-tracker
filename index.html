<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Tracker</title>
<meta name="theme-color" content="#060e1f">
<meta name="description" content="Simple daily expense tracker in KES">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef5f2;--card:#fff;--ink:#0c1f33;--mute:#5b7088;--line:#d3e3ea;--acc:#0b9a66;--acc-ink:#fff;--warn:#d98a00;--bad:#e5484d;--track:#e4f0f1;--in:#0b9a66;--soft:#f5faf8;--bgimg:radial-gradient(100% 45% at 50% 0%,#d5f2e6,transparent);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060e1f;--card:#0d1a35;--ink:#f2f6fc;--mute:#8aa0c8;--line:#1e3560;--acc:#3ee68f;--acc-ink:#03281a;--warn:#f5b73b;--bad:#ff5d6c;--track:#122448;--in:#3ee68f;--soft:#091428;--bgimg:radial-gradient(110% 50% at 50% 0%,#12305c,transparent)}}
:root[data-theme="dark"]{--bg:#060e1f;--card:#0d1a35;--ink:#f2f6fc;--mute:#8aa0c8;--line:#1e3560;--acc:#3ee68f;--acc-ink:#03281a;--warn:#f5b73b;--bad:#ff5d6c;--track:#122448;--in:#3ee68f;--soft:#091428;--bgimg:radial-gradient(110% 50% at 50% 0%,#12305c,transparent)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:6px 8px 70px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.mn button{background:none;border:0;color:var(--ink);width:36px;height:32px;font-size:20px;cursor:pointer}
.top h1{font-size:16px;margin:0;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{border:0;background:none;color:var(--ink);padding:6px;border-radius:6px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.entry .seg{background:var(--bg)}
.sum{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 10px;margin-top:8px;padding:6px 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--ink)}
.sum small{font-size:12px;color:var(--mute)}
.sum b{font-weight:600;white-space:nowrap}
.sum .bal{display:flex;align-items:baseline;gap:6px;flex:1 0 100%}
.sum .bal b{font-size:18px;font-weight:800}
.sum .bal.neg b{color:#ff9f92}
.sum .mini{font-size:13px;display:inline-flex;align-items:baseline;gap:5px;background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--ink);text-align:left}
#inb{cursor:pointer}
.note{font-size:12px;color:var(--mute);margin:4px 2px 0}
.entry{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:6px}
.entry.in{border-color:var(--acc)}
.row{display:flex;gap:6px}
input{padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;min-width:0}
#amt{flex:1;font-weight:700}
#oth{width:100%;margin-top:6px}
.entry .row{margin-top:6px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.chip{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:6px 4px;font:inherit;font-size:13px;line-height:1.2;cursor:pointer}
.chip b{font-size:20px;line-height:1.1;font-weight:400}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.add{padding:0 14px;border:0;border-radius:8px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:700;cursor:pointer}
.dt{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--mute)}
.dt input{padding:3px 6px;font-size:13px}
.dt button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}
.dt button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--warn);outline-offset:1px}
.lh{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.lh .seg{display:inline-grid;grid-template-columns:repeat(3,auto)}
.lh .seg button{padding:4px 12px;font-size:13px}
#rtot{font-size:13px;color:var(--mute)}
.led{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:6px;padding:2px 10px 4px}
.day{font-size:12px;color:var(--mute);margin:8px 0 0;display:flex;justify-content:space-between;font-weight:600}
.r{display:grid;grid-template-columns:1fr auto 26px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);cursor:pointer}
.day+.r{border-top:0}
.r .c em{display:block;font-style:normal;font-size:12px;color:var(--mute);line-height:1.2}
.r button{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:0}
.plus{color:var(--acc);font-weight:600}
.empty{color:var(--mute);padding:10px 0;margin:0}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:calc(100% - 20px)}
.toast button{background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.stt{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.stt>div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.stt small{display:block;font-size:12px;color:var(--mute)}.stt b{font-size:16px}
.an{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.an h2{font-size:14px;margin:0 0 8px;font-weight:600;display:flex;justify-content:space-between}
.an h2 span{font-weight:400;color:var(--mute);font-size:12px}
.bars{display:flex;align-items:flex-end;gap:2px;height:84px}
.bars i{flex:1;background:var(--acc);border-radius:2px 2px 0 0;min-height:2px}
.bars i.t{background:var(--warn)}
.ax{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:3px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;height:84px}
.wk div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px;font-size:11px;color:var(--mute)}
.wk i{width:100%;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px}
.tr{display:flex;gap:8px;height:96px}
.tr>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:11px;color:var(--mute)}
.tr .p{display:flex;gap:2px;align-items:flex-end;width:100%;flex:1}
.tr .p i{flex:1;background:var(--acc);border-radius:2px 2px 0 0;min-height:2px}.tr .p i+i{background:var(--warn)}
.cat{margin-top:7px}.cat>div:first-child{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.cat span:last-child{color:var(--mute)}
.track{height:6px;background:var(--track);border-radius:4px;overflow:hidden}.track i{display:block;height:100%;background:var(--acc)}
.tip{font-size:13px;margin:8px 0 0;color:var(--ink)}
.lg{display:flex;gap:12px;font-size:11px;color:var(--mute);margin-top:6px}
.top{gap:8px;margin-bottom:6px}
.pr{grid-template-columns:repeat(4,1fr)}.pr button{font-size:13px;padding:6px 2px}
.pn{display:flex;align-items:center;justify-content:space-between;margin-top:4px}.pn b{font-size:14px;font-weight:600}.pn button{background:none;border:0;color:var(--ink);width:40px;height:32px;font-size:22px;cursor:pointer}
.more{margin-top:8px}
.more summary{cursor:pointer;color:var(--mute);font-size:13px;font-weight:600;padding:8px 2px;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"▸ "}
.more[open] summary::before{content:"▾ "}
.more .an:first-of-type{margin-top:0}
.mn{display:flex;align-items:center}
.mn h1{font-size:15px;white-space:nowrap;min-width:104px;text-align:center}
.mn button{width:30px}
.top .seg{display:inline-grid}
.top .seg button{padding:5px 10px;font-size:13px}
.sum{margin-top:0}
.entry{padding:6px}
.entry .seg{padding:2px}
.entry .seg button{padding:3px;font-size:13px}
.chips{gap:4px;margin-top:5px}
.chip{padding:5px 1px;font-size:11px;border-radius:8px;gap:0}
.chip b{font-size:18px}
.chip span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .row{margin-top:5px}
.dp{position:relative;display:flex;align-items:center;gap:3px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;white-space:nowrap;cursor:pointer;color:var(--ink)}
.dp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
#amt{min-width:0;padding:8px}
.lh{margin-top:6px}
.r{padding:5px 0}
.sum{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 14px;padding:6px 10px}
.sum>*{padding:0}
.sum .bal{grid-row:1/3;flex-direction:column;align-items:flex-start;gap:0}
.sum .bal small{font-size:12px}
.sum .bal b{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.sum .mini{grid-column:2;justify-content:space-between;gap:12px;min-width:120px;font-size:12px;line-height:1.45}
.sum .mini b{font-size:13px;font-weight:600}
.led{background:none;border:0;padding:0;display:flex;flex-direction:column;gap:6px}
.led>.empty{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.dc{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dc .day{margin:0;padding:5px 10px;background:var(--track);color:var(--ink);font-size:13px}
.dc .day .num{font-weight:700}
.dc .r{padding:6px 10px}
.dc .day+.r{border-top:0}
.sum .bal.neg b{font-size:16px;font-weight:700;letter-spacing:0;color:var(--bad)}
.chip{min-width:0}
.chips{grid-template-columns:repeat(6,minmax(0,1fr))}
.entry.in .chip[aria-pressed="true"]{background:var(--acc)}
.chip span{display:block}
.hint{font-size:12px;color:var(--bad);margin-top:4px;font-weight:600}
.chips.need{outline:2px solid var(--bad);outline-offset:2px;border-radius:10px}
.chip b{display:block;font-size:22px;line-height:1.25;font-weight:400;padding:2px 0}
.chip[aria-pressed="true"] b{color:inherit}
.chip b .em{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
#oth{-webkit-appearance:none;appearance:none}#oth::-webkit-search-cancel-button,#oth::-webkit-search-decoration{-webkit-appearance:none;display:none}
.cat .em{font-size:15px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
#balc{cursor:pointer}
#left::after{content:" \270E";font-size:12px;font-weight:400;color:var(--mute)}
#adjv{flex:1;font-weight:700}
.fld{display:block;min-height:40px;padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;line-height:1.35;min-width:0;white-space:pre;overflow:hidden;cursor:text;-webkit-user-select:text;user-select:text}
.fld:focus{outline:2px solid var(--warn);outline-offset:1px}
.fld:empty::before{content:attr(data-ph);color:var(--mute);opacity:.75;pointer-events:none;font-weight:400}
#amt.fld{padding:8px;font-weight:700}
#cf button{background:none;border:0;color:var(--acc);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}
body{background:var(--bg) var(--bgimg,none) no-repeat fixed}
.sum{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 12%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.sum .bal:not(.neg) b,#inc{color:var(--in)}
#spent{color:var(--bad)}
.entry{border-color:color-mix(in srgb,var(--acc) 25%,var(--line))}
.chip{background:var(--soft)}
.chip[aria-pressed="true"]{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
#amt{background:var(--soft)}
.dc{border-color:color-mix(in srgb,var(--acc) 18%,var(--line))}
/* ---- Refined look (colors, type, motion) on the original layout ---- */
:root{--bg:#f5f2eb;--card:#fffefb;--ink:#1d1c19;--mute:#7b766b;--line:#e8e3d8;--acc:#25684f;--acc-ink:#fff;--warn:#b7791f;--bad:#c2432f;--track:#eee9de;--in:#25684f;--soft:#faf7f0;--bgimg:none;
--sumbg:var(--card);--sumbd:var(--line);--entbd:var(--line);--dcbd:var(--line);--shadow:0 1px 2px rgba(60,45,20,.05),0 4px 14px rgba(60,45,20,.04);--ease:cubic-bezier(.2,.7,.2,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sumbg:linear-gradient(135deg,color-mix(in srgb,var(--acc) 12%,var(--card)),var(--card));--sumbd:color-mix(in srgb,var(--acc) 35%,var(--line));--entbd:color-mix(in srgb,var(--acc) 25%,var(--line));--dcbd:color-mix(in srgb,var(--acc) 18%,var(--line));--shadow:none}}
:root[data-theme="dark"]{--sumbg:linear-gradient(135deg,color-mix(in srgb,var(--acc) 12%,var(--card)),var(--card));--sumbd:color-mix(in srgb,var(--acc) 35%,var(--line));--entbd:color-mix(in srgb,var(--acc) 25%,var(--line));--dcbd:color-mix(in srgb,var(--acc) 18%,var(--line));--shadow:none}
body{-webkit-font-smoothing:antialiased}
/* ---- Icon outline (light mode only) ---- */
:root{--icb:color-mix(in srgb,var(--acc) 40%,var(--line))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--icb:transparent}}
:root[data-theme="dark"]{--icb:transparent}
.chip b{width:34px;height:34px;margin:0 auto 2px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:19px;line-height:1;border:1.5px solid var(--icb);background:var(--soft)}
.chip[aria-pressed="true"] b{border-color:color-mix(in srgb,var(--acc-ink) 55%,transparent);background:color-mix(in srgb,var(--acc-ink) 18%,transparent)}
.chip[data-c="Other"] b,.chip[data-c="Other"][aria-pressed="true"] b{border-color:transparent;background:none}
/* ---- Bottom tab bar ---- */
.top{justify-content:center}
.top #views{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:20;max-width:300px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;padding:3px;gap:3px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.top #views button{padding:6px 6px;font-size:13px;border-radius:9px}
.top #views button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);box-shadow:none}
main{padding-bottom:64px}
.toast{bottom:calc(52px + env(safe-area-inset-bottom,0px))}
.seg{background:var(--track);border-color:transparent}
.entry .seg{background:var(--track)}
.seg button{color:var(--mute);transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.sum{background:var(--sumbg);border-color:var(--sumbd);box-shadow:var(--shadow)}
.entry{background:var(--card);border-color:var(--entbd);box-shadow:var(--shadow)}
.entry.in{border-color:var(--acc)}
.chip{background:var(--soft);border-color:var(--line);transition:transform .15s var(--ease),background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);box-shadow:none}
.fld,#adjv{border-color:var(--line);background:var(--soft);transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease)}
.fld:focus,input:focus,input:focus-visible{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 16%,transparent);background:var(--card)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.dp{background:var(--soft);transition:background .2s var(--ease)}
.add{transition:transform .15s var(--ease),filter .2s var(--ease)}
.add:active{transform:scale(.96);filter:brightness(.94)}
.dc{background:var(--card);border-color:var(--dcbd);box-shadow:var(--shadow)}
.dc .r{transition:background .15s var(--ease)}
.dc .r:active{background:var(--soft)}
.r button{opacity:.7;transition:opacity .15s,color .15s}
.r button:active{opacity:1;color:var(--bad)}
.stt>div,.an{box-shadow:var(--shadow);border-color:var(--line)}
.toast{box-shadow:0 8px 24px rgba(0,0,0,.18);animation:toastin .3s var(--ease) both}
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#vTrack,#vAn,#vTrack>.sum,#vTrack>.entry{animation:fadeup .35s var(--ease) both}
.bars i,.wk i,.tr .p i{transform-origin:bottom;animation:grow .55s var(--ease) both}
.track i{transform-origin:left;animation:growx .65s var(--ease) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="mn"><button id="prev" aria-label="Previous month">‹</button><h1 id="mname"></h1><button id="next" aria-label="Next month">›</button></div>
    <div class="seg" id="views"><button data-v="track" aria-pressed="true">Track</button><button data-v="an" aria-pressed="false">Analytics</button></div>
  </div>

  <div id="vTrack">
    <div class="sum">
      <div class="bal" id="balc" role="button" tabindex="0" aria-label="Edit balance"><small id="lbl">Balance</small><b class="num" id="left"></b></div>
      <button class="mini" id="inb" aria-label="Add income"><small>Income</small><b class="num" id="inc"></b></button>
      <div class="mini"><small>Spent</small><b class="num" id="spent"></b></div>
    </div>
    <div class="note" id="cf" hidden></div>
    <div class="entry" id="adjp" hidden>
      <div class="note" style="margin:0">Set balance to what you actually have</div>
      <div class="row">
        <div id="adjv" class="fld" contenteditable="plaintext-only" role="textbox" aria-multiline="false" inputmode="decimal" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" data-ph="Actual balance" aria-label="Actual balance in KES"></div>
        <button class="add" id="adjs">Set</button>
        <button class="link" id="adjc" style="padding:0 6px">Cancel</button>
      </div>
    </div>

    <div class="entry" id="entry">
      <div class="seg" id="seg"><button data-m="e" aria-pressed="true">Spent</button><button data-m="i" aria-pressed="false">Income</button></div>
      <div class="chips" id="chips"></div>
      <div class="hint" id="hint" hidden></div>
      <div id="oth" class="fld" contenteditable="plaintext-only" role="textbox" aria-multiline="false" inputmode="text" autocorrect="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="done" data-ph="What was it? (e.g. Rent)" aria-label="Other" hidden></div>
      <div class="row">
        <div id="amt" class="fld" contenteditable="plaintext-only" role="textbox" aria-multiline="false" inputmode="decimal" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" data-ph="Amount" aria-label="Amount in KES"></div>

  var out=sign+cs(ip)+(dot?'.'+dp:''),i=0,n=0;
  for(;i<out.length&&n<before;i++){if(/[\d.]/.test(out.charAt(i)))n++}
  if(sign&&i===0)i=1;

function toCsv(){var q=function(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},L=[['type','date','category','amount','note','received']];
  S.items.forEach(function(x){L.push(['expense',x.d,x.c,x.a,x.n||'',''])});
  S.inc.forEach(function(x){L.push(['income',x.d,x.c,x.a,x.n||'',x.got===false?'no':'yes'])});
  (S.adj||[]).forEach(function(x){L.push(['adjustment',x.d,'Balance adjustment',x.a,'',''])});
  Object.keys(S.ic||{}).forEach(function(c){L.push(['icon','',c,'',S.ic[c],''])});
  return L.map(function(r){return r.map(q).join(',')}).join('\r\n')}
function csvRows(t){var R=[],r=[],c='',q=false;t=t.replace(/^\uFEFF/,'');
  for(var i=0;i<t.length;i++){var ch=t.charAt(i);
    if(q){if(ch==='"'){if(t.charAt(i+1)==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t.charAt(i+1)==='\n')i++;r.push(c);c='';R.push(r);r=[]}
    else c+=ch}
  if(c!==''||r.length){r.push(c);R.push(r)}
  return R.filter(function(x){return x.length>1})}
function fromCsv(t){var R=csvRows(t);if(!R.length)return null;
  var H=R.shift().map(function(h){return h.trim().toLowerCase()}),o={items:[],inc:[],adj:[],ic:{}},n=0;
  if(H.indexOf('type')<0||H.indexOf('amount')<0)return null;
  R.forEach(function(r){var g=function(k){var i=H.indexOf(k);return i<0?'':(r[i]||'').trim()},
    ty=g('type').toLowerCase(),a=parseFloat(g('amount')),d=g('date'),id='i'+Date.now().toString(36)+(n++);
    if(ty==='icon'){if(g('category'))o.ic[g('category')]=g('note');return}
    if(!d||isNaN(a))return;
    if(ty==='adjustment')o.adj.push({id:id,d:d,a:a});
    else if(ty==='income'){var x={id:id,d:d,c:g('category')||'Money in',a:a,n:g('note')};if(g('received').toLowerCase()==='no')x.got=false;o.inc.push(x)}
    else o.items.push({id:id,d:d,c:g('category')||'Other',a:a,n:g('note')})});
  return o}

function fld(el){
  if(el.contentEditable!=='plaintext-only')el.contentEditable='true';
  Object.defineProperty(el,'value',{get:function(){return el.textContent.replace(/\u00a0/g,' ')},set:function(v){el.textContent=v}});
